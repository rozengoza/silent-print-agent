name: Build Silent Print Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # cd into agent/ before running commands
      - name: Install dependencies
        working-directory: agent
        run: npm install
      - name: Build Windows
        working-directory: agent
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: agent/dist/*.exe  # path includes agent/

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # cd into agent/ before running commands
      - name: Install dependencies
        working-directory: agent
        run: npm install
      - name: Build Mac
        working-directory: agent
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: agent/dist/*.dmg  # path includes agent/

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-build
      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: mac-build
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-build/*.exe
            mac-build/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
